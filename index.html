<head>
<meta charset="utf-8">

<title>参加者向けページ</title>
<style>
:root { --bg:#F2EFE9; --ink:#17171F; --muted:#666470; --line:#DDD8CE; --blue:#3438E8; --red:#DC4110; color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Meiryo",sans-serif; padding:24px 16px; line-height:1.7; }
form { width:100%; max-width:360px; background:#fff; border:2px solid var(--blue); border-top-width:7px; border-radius:14px; padding:20px; display:grid; gap:14px; }
h1 { margin:0; font-size:18px; }
p { margin:0; font-size:14px; color:var(--muted); }
input[type=password] { font:inherit; font-size:16px; width:100%; padding:10px 12px; border:2px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
label.r { display:flex; gap:8px; align-items:center; font-size:14px; }
label.r input { width:18px; height:18px; accent-color:var(--red); }
button { font:inherit; font-weight:700; background:var(--red); color:#fff; border:0; border-radius:99px; padding:12px; cursor:pointer; }
button:disabled { opacity:.6; }
.err { color:var(--red); font-weight:700; font-size:14px; min-height:1.4em; }
:focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>参加者向けページです</h1>

</form>

  if (saved) {
    unlock(b64(saved)).catch(function () { try { localStorage.removeItem(KEY); } catch (e) {} showForm(); });
  } else { showForm(); }
  f.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = document.getElementById("pw").value.trim();
    if (!pw) { err.textContent = "パスワードを入れてください。"; return; }
    go.disabled = true; err.textContent = "確認しています…";
    var keep = document.getElementById("keep").checked;
    derive(pw).then(function (bits) {
      var raw = new Uint8Array(bits);
      return decrypt(raw).then(function (buf) {
        if (keep) { try { localStorage.setItem(KEY, btoa(String.fromCharCode.apply(null, raw))); } catch (e) {} }
        show(buf);
      });
    }).catch(function () {
      go.disabled = false; err.textContent = "パスワードが違います。";
    });
  });
})();
</script>
</body>
